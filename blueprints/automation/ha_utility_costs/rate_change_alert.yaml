blueprint:
  name: eRateManager Utility Rate & Health Alert
  description: Notify when utility rates change or when the eRateManager API problem sensor turns on.
  domain: automation
  input:
    rate_entities:
      name: Rate Sensors to Watch
      description: Select one or more electric or water rate sensors to monitor for price changes.
      selector:
        entity:
          multiple: true
          filter:
            - integration: ha_utility_costs
              domain: sensor
    problem_entity:
      name: API Problem Binary Sensor (Optional)
      description: Select the API problem binary sensor from HA Utility Costs to alert on disconnects or stale rates.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: ha_utility_costs
              domain: binary_sensor
    notify_device:
      name: Mobile Device to Notify
      selector:
        device:
          integration: mobile_app

mode: queued

trigger:
  - platform: state
    id: rate_change
    entity_id: !input rate_entities
  - platform: state
    id: api_problem
    entity_id: !input problem_entity
    to: "on"

condition:
  - condition: template
    value_template: >-
      {% if trigger.id == 'rate_change' %}
        {{ trigger.from_state is not none
           and trigger.to_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable', 'none', '']
           and trigger.to_state.state not in ['unknown', 'unavailable', 'none', '']
           and (trigger.from_state.state | float(0)) != (trigger.to_state.state | float(0)) }}
      {% else %}
        true
      {% endif %}

action:
  - choose:
      - conditions:
          - condition: trigger
            id: rate_change
        sequence:
          - variables:
              old_val: "{{ trigger.from_state.state | float(0) }}"
              new_val: "{{ trigger.to_state.state | float(0) }}"
              pct_str: >-
                {% if old_val > 0 %}
                  {{ (((new_val - old_val) / old_val) * 100) | round(2) }}%
                {% else %}
                  N/A
                {% endif %}
              friendly: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }}"
              unit: "{{ trigger.to_state.attributes.unit_of_measurement | default('') }}"
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "Utility Rate Changed: {{ friendly }}"
            message: "{{ friendly }} changed from {{ old_val }} to {{ new_val }} {{ unit }} ({{ pct_str }})."
      - conditions:
          - condition: trigger
            id: api_problem
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input notify_device
            title: "eRateManager API Alert"
            message: "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id) }} reported an API or stale-rate issue."
