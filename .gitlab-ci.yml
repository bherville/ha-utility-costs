stages:
  - validate
  - version
  - package
  - release

validate:python:
  stage: validate
  image: python:3.12-alpine
  script:
    - python3 -m py_compile custom_components/ha_utility_costs/*.py
    - |
      python3 -c "
      import json
      hacs = json.load(open('hacs.json'))
      manifest = json.load(open('custom_components/ha_utility_costs/manifest.json'))
      pkg = json.load(open('package.json'))
      assert manifest['domain'] == 'ha_utility_costs', 'Invalid domain'
      assert manifest['version'] == pkg['version'], f'Version mismatch: manifest={manifest[\"version\"]} vs package={pkg[\"version\"]}'
      "
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

validate:hassfest:
  stage: validate
  image:
    name: ghcr.io/home-assistant/hassfest:latest
    entrypoint: [""]
  script:
    - python3 -m script.hassfest --integration-path custom_components/ha_utility_costs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

version:changeset:
  stage: version
  image: node:20-alpine
  before_script:
    - apk add --no-cache git jq
  script:
    - |
      CHANGESETS=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')
      if [ -z "$CHANGESETS" ]; then
        echo "No pending changesets found. Skipping version bump."
        exit 0
      fi
    - npm ci
    - npm run version
    - VERSION=$(jq -r '.version' custom_components/ha_utility_costs/manifest.json)
    - |
      if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
        echo "Tag v${VERSION} already exists. Aborting."
        exit 1
      fi
    - git config user.name "GitLab Release Bot"
    - git config user.email "release-bot@bherville.com"
    - git remote set-url origin "https://oauth2:${GITLAB_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add package.json package-lock.json CHANGELOG.md .changeset custom_components/ha_utility_costs/manifest.json
    - git commit -m "chore(release): v${VERSION}"
    - git push -o ci.skip origin "HEAD:${CI_DEFAULT_BRANCH}"
    - git tag -a "v${VERSION}" -m "Release v${VERSION}"
    - git push origin "v${VERSION}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

package:zip:
  stage: package
  image: alpine:3.20
  before_script:
    - apk add --no-cache zip curl
  script:
    - cd custom_components && zip -r ../ha_utility_costs.zip ha_utility_costs && cd ..
    - |
      curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        --upload-file ha_utility_costs.zip \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ha-utility-costs/${CI_COMMIT_TAG}/ha_utility_costs.zip"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: package:zip
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "HA Utility Costs $CI_COMMIT_TAG"
    description: "Automated release for `$CI_COMMIT_TAG`. See `CHANGELOG.md` for details."
    assets:
      links:
        - name: "ha_utility_costs.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ha-utility-costs/${CI_COMMIT_TAG}/ha_utility_costs.zip"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
